name: Build y despliegue

on:
  push:
    branches: [master]

# Evita dos despliegues simultáneos usando el mismo peer de WireGuard
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Ejecutar tests
        run: chmod +x gradlew && ./gradlew test --no-daemon

      - name: Nombre de imagen en minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login en GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Construir imagen
        run: podman build -f Containerfile -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .

      - name: Publicar imagen
        run: |
          podman push "$IMAGE:latest"
          podman push "$IMAGE:${{ github.sha }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Si usás Environment secrets, descomentá la siguiente línea:
    # environment: produccion
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
    steps:
      - name: Instalar WireGuard
        run: sudo apt-get update && sudo apt-get install -y wireguard-tools

      - name: Levantar la VPN
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          printf '%s\n' "$WG_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
      - name: Diagnóstico VPN (temporal)
        continue-on-error: true
        run: |
          echo "=== Estado de WireGuard ==="
          sleep 5
          sudo wg show
          echo "=== Rutas ==="
          ip route
          echo "=== Ruta hacia el VPS ==="
          ip route get "$VPS_HOST"
          echo "=== Ping al VPS ==="
          ping -c 3 -W 2 "$VPS_HOST" || true

      - name: Esperar a que el VPS responda por la VPN
        run: timeout 30 bash -c 'until nc -z "$VPS_HOST" "$VPS_PORT"; do sleep 2; done'

      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Actualizar contenedor en el VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            export XDG_RUNTIME_DIR=/run/user/$(id -u)
            podman auto-update
            podman image prune -f
            systemctl --user is-active academia-fo-backend
          '

      - name: Cerrar la VPN
        if: always()
        run: sudo wg-quick down wg0 || true