spring.application.name=academia-fo-back
#DataSource Settings
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA/Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

#Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.default-schema=config

#JWT
jwt.secret=${JWT_SECRET}
jwt.access-expiracion=15m
jwt.refresh-expiracion=7d

#Server
server.port=8080

#Debug
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot.web.servlet=DEBUG

#Reporte PDF (imágenes opcionales de membrete, p. ej. classpath:reportes/cabecera.png)
reporte.pdf.cabecera-imagen=classpath:reportes/encabezado-para-docs.png
reporte.pdf.pie-imagen=classpath:reportes/pie-para-docs.png
